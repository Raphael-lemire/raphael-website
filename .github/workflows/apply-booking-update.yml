name: Apply booking calendar update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-booking-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-booking-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply booking calendar patch
        run: |
          cat <<'PATCH' >/tmp/booking-update.patch
